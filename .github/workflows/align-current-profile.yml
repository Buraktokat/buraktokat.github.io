name: Align current artist profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-current-profile.yml'

permissions:
  contents: write

jobs:
  align-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified profile updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f'{path}: expected at least 1 occurrence, found 0: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          patch('index.html', [
              (
                  'content="Official website of Burak Tokat — Turkish DJ and electronic music producer. Melodic Techno, Melodic House and Afro House."',
                  'content="Official website of Burak Tokat — Turkish DJ and electronic music producer. Production focused on Melodic Techno and Melodic House, with Afro House represented in selected DJ sets."'
              ),
              (
                  '"description": "Burak Tokat is a Turkish DJ and electronic music producer active since 2020, based in Antalya, Türkiye. He has performed at the Konya and Bursa branches of Club Inferno Mania. His music moves between Melodic Techno, Melodic House and Afro House."',
                  '"description": "Burak Tokat is a Turkish DJ and electronic music producer active since 2020, based in Antalya, Türkiye. His professional background includes six years with Club Inferno Mania across Konya and Bursa. His production direction focuses primarily on Melodic Techno and Melodic House, while Afro House is also represented in selected DJ sets."'
              ),
              (
                  'Melodic Techno • Melodic House • Afro House<br>\n        Turkish DJ and electronic music producer.',
                  'Melodic Techno • Melodic House<br>\n        Afro House in selected DJ sets.'
              ),
              (
                  'His musical direction moves between\n          Melodic Techno, Melodic House,\n          Afro House and contemporary electronic music.',
                  'His production direction focuses on\n          Melodic Techno and Melodic House,\n          while Afro House remains part of selected DJ sets.'
              ),
              (
                  '<span>Club Experience</span>\n          <h3>Club Inferno Mania<br>Konya</h3>',
                  '<span>Six-Year Club Background</span>\n          <h3>Club Inferno Mania<br>Konya</h3>'
              ),
              (
                  'Selected past club experience. This section presents professional\n        background only; it does not list upcoming shows or ticket sales.',
                  'Six years of professional club experience with Club Inferno Mania across Konya and Bursa, alongside selected work at Mr. Frog Konya. This section presents professional background only; it does not list upcoming shows or ticket sales.'
              ),
          ])

          patch('about.html', [
              (
                  'content="Official English biography of Burak Tokat, a Turkish DJ and electronic music producer based in Antalya, active since 2020 across Melodic Techno, Melodic House and Afro House."',
                  'content="Official English biography of Burak Tokat, a Turkish DJ and electronic music producer based in Antalya. Active since 2020, his production focus is Melodic Techno and Melodic House, with Afro House represented in selected DJ sets."'
              ),
              (
                  '"description": "Burak Tokat is a Turkish DJ and electronic music producer active since 2020 and based in Antalya, Türkiye. His musical direction moves between Melodic Techno, Melodic House and Afro House."',
                  '"description": "Burak Tokat is a Turkish DJ and electronic music producer active since 2020 and based in Antalya, Türkiye. His professional background includes six years with Club Inferno Mania. His production focus is Melodic Techno and Melodic House, with Afro House represented in selected DJ sets."'
              ),
              (
                  '<p class="lead">Burak Tokat is a Turkish DJ and electronic music producer based in Antalya, Türkiye. Active since 2020, his work is shaped by melodic atmosphere, hypnotic rhythm and modern club energy, moving between Melodic Techno, Melodic House and Afro House.</p>',
                  '<p class="lead">Burak Tokat is a Turkish DJ and electronic music producer based in Antalya, Türkiye. Active since 2020, his production work focuses primarily on Melodic Techno and Melodic House, while Afro House remains part of selected DJ sets.</p>'
              ),
              (
                  '<p>Tokat began his DJ career in 2020. His selected club experience includes Club Inferno Mania in Konya and Bursa and Mr. Frog in Konya. Alongside DJ performance, he develops original electronic music with an emphasis on emotional melodic writing and club-focused arrangement.</p>',
                  '<p>Tokat began his DJ career in 2020 and built a six-year professional club background with Club Inferno Mania across Konya and Bursa. His selected experience also includes Mr. Frog in Konya. Alongside DJ performance, he develops original electronic music with an emphasis on emotional melodic writing and club-focused arrangement.</p>'
              ),
              (
                  '<div class="fact"><span>Active since</span><strong>2020</strong></div>',
                  '<div class="fact"><span>Active since</span><strong>2020</strong></div>\n        <div class="fact"><span>Club background</span><strong>6 years · Club Inferno Mania</strong></div>'
              ),
          ])

          patch('hakkinda.html', [
              (
                  '<meta name="description" content="Burak Tokat\'ın resmî Türkçe biyografisi. Antalya merkezli Türk DJ ve elektronik müzik prodüktörü; 2020\'den beri Melodic Techno, Melodic House ve Afro House alanlarında aktif.">',
                  '<meta name="description" content="Burak Tokat\'ın resmî Türkçe biyografisi. Antalya merkezli Türk DJ ve elektronik müzik prodüktörü; prodüksiyon odağı Melodic Techno ve Melodic House, seçilmiş DJ setlerinde Afro House.">'
              ),
              (
                  '"description": "Burak Tokat, 2020\'den beri aktif olan Antalya merkezli Türk DJ ve elektronik müzik prodüktörüdür. Müzikal yönü Melodic Techno, Melodic House ve Afro House türleri arasında şekillenir."',
                  '"description": "Burak Tokat, 2020\'den beri aktif olan Antalya merkezli Türk DJ ve elektronik müzik prodüktörüdür. Profesyonel geçmişinde Club Inferno Mania bünyesinde altı yıllık kulüp deneyimi bulunur. Prodüksiyon odağı Melodic Techno ve Melodic House olup Afro House seçilmiş DJ setlerinde yer alır."'
              ),
              (
                  '<p class="lead">Burak Tokat, Antalya merkezli Türk DJ ve elektronik müzik prodüktörüdür. 2020\'den beri aktif olan Tokat\'ın müzikal yaklaşımı melodik atmosfer, hipnotik ritimler ve modern kulüp enerjisini bir araya getirir; Melodic Techno, Melodic House ve Afro House arasında şekillenir.</p>',
                  '<p class="lead">Burak Tokat, Antalya merkezli Türk DJ ve elektronik müzik prodüktörüdür. 2020\'den beri aktif olan Tokat\'ın prodüksiyon odağı Melodic Techno ve Melodic House\'tur; Afro House ise seçilmiş DJ setlerinde repertuvarının bir parçasıdır.</p>'
              ),
              (
                  '<p>Tokat, DJ kariyerine 2020 yılında başladı. Seçilmiş kulüp deneyimleri arasında Club Inferno Mania Konya, Club Inferno Mania Bursa ve Mr. Frog Konya yer alır. DJ performanslarının yanında duygusal melodik anlatımı kulüp odaklı prodüksiyon yapısıyla birleştiren özgün elektronik müzik çalışmaları üretmektedir.</p>',
                  '<p>Tokat, DJ kariyerine 2020 yılında başladı ve Club Inferno Mania bünyesinde Konya ve Bursa\'yı kapsayan altı yıllık profesyonel kulüp geçmişi oluşturdu. Seçilmiş deneyimleri arasında Mr. Frog Konya da yer alır. DJ performanslarının yanında duygusal melodik anlatımı kulüp odaklı prodüksiyon yapısıyla birleştiren özgün elektronik müzik çalışmaları üretmektedir.</p>'
              ),
              (
                  '<div class="fact"><span>Aktif</span><strong>2020\'den beri</strong></div>',
                  '<div class="fact"><span>Aktif</span><strong>2020\'den beri</strong></div>\n        <div class="fact"><span>Kulüp geçmişi</span><strong>6 yıl · Club Inferno Mania</strong></div>'
              ),
          ])

          patch('press/index.html', [
              (
                  '<div class="fact"><small>Active Since</small><strong>2020</strong></div>',
                  '<div class="fact"><small>Club Background</small><strong>6 Years<br>Club Inferno Mania</strong></div>'
              ),
              (
                  '<p>Burak Tokat is a Turkish DJ and electronic music producer based in Antalya, Türkiye. Active since 2020, he developed his background through the Turkish club scene before placing a stronger focus on original music production.</p>',
                  '<p>Burak Tokat is a Turkish DJ and electronic music producer based in Antalya, Türkiye. Active since 2020, he built a six-year professional club background with Club Inferno Mania across Konya and Bursa before placing a stronger focus on original music production.</p>'
              ),
              (
                  '<p>His sound moves primarily between Melodic Techno and Melodic House, combining atmospheric melodies, hypnotic grooves and modern club energy. Tokat is currently entering a new stage of his artist project, with a stronger international focus and an expanding catalog of original productions.</p>',
                  '<p>His production sound moves primarily between Melodic Techno and Melodic House, combining atmospheric melodies, hypnotic grooves and modern club energy. Afro House also remains part of selected DJ sets. Tokat is currently entering a new stage of his artist project, with a stronger international focus and an expanding catalog of original productions.</p>'
              ),
          ])

          patch('sitemap.xml', [
              ('<lastmod>2026-08-22</lastmod>', '<lastmod>2026-08-23</lastmod>'),
              ('<lastmod>2026-08-22</lastmod>', '<lastmod>2026-08-23</lastmod>'),
              ('<lastmod>2026-08-22</lastmod>', '<lastmod>2026-08-23</lastmod>'),
              ('<lastmod>2026-08-22</lastmod>', '<lastmod>2026-08-23</lastmod>'),
          ])

          old_webp = Path('burak-tokat-hero.webp')
          if old_webp.exists():
              old_webp.unlink()
          PY

      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html hakkinda.html press/index.html sitemap.xml
          git add -u burak-tokat-hero.webp || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align artist profile and highlight six-year club background"
          git push
